{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Login / Signup</title>
    <link rel="stylesheet" href="{% static 'css/accounts/style.css' %}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <style>
        /* PageFlip用のスタイル */
        #login-book {
            width: 400px;
            height: 600px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }
        .page {
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .page[data-density="hard"] {
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div id="login-book">
        <!-- ログインフォーム -->
        <div class="page" data-density="hard">
            <div class="form-container">
                <form class="login-form" method="post" action="{% url 'accounts:login' %}" id="login-form">
                    {% csrf_token %}
                    <p class="login-text">Login</p>
                    {{ form.username }}
                    {{ form.password }}
                    <input type="submit" value="Login" class="login-submit">
                </form>
                <div class="login-links">
                    <a href="#" class="login-signup" onclick="flipToSignup()">アカウントを新しく作成</a>
                    <a href="#" class="login-forgot-pass">パスワードを忘れましたか？</a>
                </div>
            </div>
        </div>

        <!-- サインアップフォーム -->
        <div class="page" data-density="hard">
            <div class="form-container">
                <form method="post" class="login-form">
                    {% csrf_token %}
                    <p class="login-text">Signup</p>
                    <input type="text" name="username" class="login-input" placeholder="Username" required autofocus>
                    <input type="email" name="email" class="login-input" placeholder="Email" required>
                    <input type="password" name="password1" class="login-input" placeholder="Password" required>
                    <input type="password" name="password2" class="login-input" placeholder="Confirm Password" required>
                    <input type="submit" value="Sign Up" class="login-submit">
                </form>
                <div class="login-links">
                    <a href="#" class="login-signup" onclick="flipToLogin()">既にアカウントをお持ちの方はこちら</a>
                </div>
            </div>
        </div>
    </div>
    <div class="underlay-photo"></div>
    <div class="underlay-black"></div>
    <script>
        // PageFlipの初期化
        const pageFlip = new St.PageFlip(
            document.getElementById("login-book"),
            {
                width: 400,  // ページの幅
                height: 600, // ページの高さ
                showCover: true,
                mobileScrollSupport: false
            }
        );

        pageFlip.loadFromHTML(document.querySelectorAll(".page"));

        // ログインフォームに移動
        function flipToLogin() {
            pageFlip.flip(0);
        }

        // サインアップフォームに移動
        function flipToSignup() {
            pageFlip.flip(1);
        }
    </script>
</body>
</html>
